<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macropad</title>
<style>
  :root {
    --bg: #eceae5; --card: #fff; --ink: #1b1b1d; --mute: #6d6d73; --line: #dcdad4;
    --accent: #d9480f; --ok: #2f9e44; --err: #e03131;
    --body1: #6b6f75; --body2: #2e3136; --cap1: #fbfbfa; --cap2: #d9d8d4;
    --glow: 0,0,0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --card: #1e1e21; --ink: #f1f1f2; --mute: #97979d; --line: #34343a;
      --body1: #4a4d53; --body2: #202227; --cap1: #e8e8e6; --cap2: #b9b8b4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --card: #1e1e21; --ink: #f1f1f2; --mute: #97979d; --line: #34343a;
    --body1: #4a4d53; --body2: #202227; --cap1: #e8e8e6; --cap2: #b9b8b4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding-block: 28px; padding-left: 20px; padding-right: 20px;
          display: grid; gap: 20px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
  .status { font-size: 13px; color: var(--mute); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
  .dot.on { background: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 0 0 14px; }

  /* Le macropad dessiné */
  .stage { display: flex; justify-content: center; padding: 34px 16px 46px;
           background: radial-gradient(120% 130% at 50% 0%, #26262b 0%, #121215 100%);
           border-radius: 16px; overflow: hidden; }
  .device { position: relative; display: flex; align-items: center; gap: 20px;
            padding: 18px 22px; border-radius: 16px;
            background: linear-gradient(170deg, var(--body1), var(--body2));
            box-shadow: 0 18px 30px -12px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.22); }
  .device::after {  /* la lueur des LED sous le boîtier */
    content: ""; position: absolute; left: 12%; right: 12%; bottom: -26px; height: 40px;
    border-radius: 50%; filter: blur(16px); opacity: .85;
    background: rgba(var(--glow), .55); transition: background .4s; }
  .knobwrap { display: flex; align-items: center; gap: 10px; }
  .arrow { width: 26px; height: 46px; border: 0; border-radius: 8px; cursor: pointer;
           background: rgba(255,255,255,.07); color: #e9e9ea; font-size: 15px; }
  .arrow:hover { background: rgba(255,255,255,.16); }
  .arrow.sel { outline: 2px solid var(--accent); }
  .knob { width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
          position: relative; background: linear-gradient(165deg, #d7d6d2, #a3a29d);
          box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 3px 6px rgba(0,0,0,.45); }
  .knob::after { content: ""; position: absolute; left: 50%; top: 11px; width: 4px; height: 13px;
                 margin-left: -2px; border-radius: 2px; background: #5d5c58; }
  .knob.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
  .caps { display: flex; gap: 12px; }
  .cap { width: 88px; height: 88px; border: 0; border-radius: 9px; cursor: pointer; padding: 6px;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
         background: linear-gradient(180deg, var(--cap1), var(--cap2));
         box-shadow: 0 5px 0 rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.9);
         color: #26262a; font: inherit; transition: transform .08s, box-shadow .08s; }
  .cap:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .cap .num { font-size: 10px; letter-spacing: .1em; color: #8a8a8f; }
  .cap .txt { font-size: 12.5px; font-weight: 600; text-align: center; line-height: 1.25;
              overflow-wrap: anywhere; }
  .cap.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
  .cap .led { width: 22px; height: 5px; border-radius: 3px; margin-top: 4px;
              background: var(--c, #555); }

  /* Éditeur */
  .cols { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button, .btn { font: inherit; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--line);
         background: transparent; color: var(--ink); cursor: pointer; }
  .tabs button:hover, .btn:hover { border-color: var(--mute); }
  .tabs button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chord { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 0;
           border-bottom: 1px dashed var(--line); }
  .mods label { display: inline-flex; align-items: center; gap: 3px; margin-right: 8px; font-size: 14px; }
  select, input[type=text] { font: inherit; padding: 6px 9px; border-radius: 9px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); max-width: 100%; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .hint { color: var(--mute); font-size: 13px; }
  .hint code { background: rgba(125,125,135,.16); padding: 1px 5px; border-radius: 5px; }
  .capture.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ledblock { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .ledblock b { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .ledblock .btn { padding: 3px 9px; font-size: 13px; font-weight: 400; }
  .ledblock .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ledrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; flex-wrap: wrap; }
  .ledrow span { width: 82px; color: var(--mute); font-size: 13px; }
  input[type=color] { width: 44px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
                      padding: 2px; background: var(--card); cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #msg { min-height: 1.4em; font-size: 14px; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
  .sign { text-align: center; color: var(--mute); font-size: 13px; margin: 0; }
  .sign a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Macropad</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="devtxt">…</span></span>
  </header>

  <div class="stage"><div class="device" id="pad"></div></div>

  <div class="cols">
    <section class="card">
      <h2 id="edtitle">Touche</h2>
      <div class="tabs" id="kinds">
        <button data-k="keys">Clavier</button>
        <button data-k="media">Multimédia</button>
        <button data-k="action">Action Mac</button>
      </div>
      <div id="editor"></div>
    </section>

    <section class="card">
      <h2>Éclairage</h2>
      <div id="leds"></div>
      <div class="row"><span class="hint" style="width:70px">Luminosité</span>
        <input type="range" id="bright" min="10" max="255"></div>
      <div class="row"><span class="hint" style="width:70px">Vitesse</span>
        <input type="range" id="speed" min="1" max="10"></div>
    </section>
  </div>

  <section class="card">
    <div class="row" style="margin-top:0">
      <button class="btn primary" id="save">Enregistrer sur le clavier</button>
      <button class="btn" id="upload">Mettre à jour le firmware</button>
      <input type="text" id="test" placeholder="Zone de test : appuie sur les touches ici" style="flex:1;min-width:200px">
    </div>
    <p class="hint" id="flashhint"></p>
    <div id="msg"></div>
  </section>
  <p class="sign">Made by Emilien Colin 🇨🇭 ·
    <a href="https://github.com/meutedechien/macropad-mini-keyboard">code source</a></p>
</div>

<script>
const MODS = [["ctrl","Ctrl"],["shift","Maj"],["alt","Option"],["cmd","Cmd"]];
const KEYS = "a b c d e f g h i j k l m n o p q r s t u v w x y z 1 2 3 4 5 6 7 8 9 0 enter escape backspace tab space minus equal leftbracket rightbracket backslash semicolon quote grave comma dot slash capslock f1 f2 f3 f4 f5 f6 f7 f8 f9 f10 f11 f12 f13 f14 f15 f16 f17 f18 f19 f20 f21 f22 f23 f24 printscreen scrolllock pause insert home pageup delete end pagedown right left down up numlock numpadslash numpadasterisk numpadminus numpadplus numpadenter numpad1 numpad2 numpad3 numpad4 numpad5 numpad6 numpad7 numpad8 numpad9 numpad0 numpaddot numpadequal application power".split(" ");
const MEDIA = [["play","Lecture/Pause"],["next","Suivant"],["prev","Précédent"],["stop","Stop"],["mute","Muet"],["volumeup","Volume +"],["volumedown","Volume −"],["screenlock","Verrouiller"],["calculator","Calculatrice"],["favorites","Favoris"]];
const MOUSE = [];
const EFFECTS = [["eteinte","Éteinte"],["fixe","Fixe"],["respiration","Respire"],["clignote","Clignote"],["arc-en-ciel","Arc-en-ciel"]];
const EFFECTS_PRESS = [["comme_repos","Comme au repos"], ...EFFECTS, ["flash","Flash puis fondu"]];
const DEFAULT_LEDS = [
  {repos: {effet: "fixe", couleur: "#ff2000"}, appui: {effet: "comme_repos", couleur: "#ff2000"}},
  {repos: {effet: "fixe", couleur: "#0040ff"}, appui: {effet: "comme_repos", couleur: "#0040ff"}},
  {repos: {effet: "fixe", couleur: "#00c83c"}, appui: {effet: "clignote", couleur: "#00c83c"}}];
let pendingSend = false;
let previewMask = 0, liveTimer = null, devState = "absent";

// Applique les réglages au clavier sans rien enregistrer (regroupe les changements rapides)
function scheduleLive() {
  if (devState !== "direct") return;
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    try {
      const r = await (await fetch("/api/live", {method: "POST",
        body: JSON.stringify({state, preview: previewMask})})).json();
      if (!r.ok) say(r.msg, false);
    } catch { say("Serveur injoignable : relance l'appli.", false); }
  }, 80);
}
const SLOTS = [
  {id:"b0", name:"Touche 1"}, {id:"b1", name:"Touche 2"}, {id:"b2", name:"Touche 3"},
  {id:"ccw", name:"Molette ← (gauche)"}, {id:"press", name:"Molette (appui)"}, {id:"cw", name:"Molette → (droite)"},
];
// event.code du Mac → nom de touche de l'outil
const CODEMAP = {Enter:"enter",Escape:"escape",Backspace:"backspace",Tab:"tab",Space:"space",Minus:"minus",Equal:"equal",
  BracketLeft:"leftbracket",BracketRight:"rightbracket",Backslash:"backslash",Semicolon:"semicolon",Quote:"quote",
  Backquote:"grave",Comma:"comma",Period:"dot",Slash:"slash",CapsLock:"capslock",Insert:"insert",Home:"home",
  PageUp:"pageup",Delete:"delete",End:"end",PageDown:"pagedown",ArrowRight:"right",ArrowLeft:"left",ArrowDown:"down",
  ArrowUp:"up",NumpadDivide:"numpadslash",NumpadMultiply:"numpadasterisk",NumpadSubtract:"numpadminus",
  NumpadAdd:"numpadplus",NumpadEnter:"numpadenter",NumpadDecimal:"numpaddot",NumpadEqual:"numpadequal",IntlBackslash:"grave"};

const ACTIONS = [["app","Ouvrir une application"],["terminal","Commande dans Terminal"],["shell","Commande en arrière-plan"]];
let state, sel = "b0", apps = [];

const $ = s => document.querySelector(s);
const label = v => {
  const m = [...MEDIA, ...MOUSE].find(x => x[0] === v.replace(/^(ctrl|shift|alt)-/, ""));
  if (m) return (v.includes("-") && !MEDIA.find(x=>x[0]===v) ? v.split("-")[0] + " + " : "") + m[1];
  return v.replace(/cmd-/g,"⌘").replace(/alt-/g,"⌥").replace(/shift-/g,"⇧").replace(/ctrl-/g,"⌃") || "—";
};
const getVal = id => id[0] === "b" ? state.layers[0].buttons[+id[1]] : state.layers[0].knob[id];
const setVal = (id, v) => { if (id[0] === "b") state.layers[0].buttons[+id[1]] = v; else state.layers[0].knob[id] = v; renderPad(); scheduleLive(); };

function kindOf(v) {
  if (MEDIA.some(m => m[0] === v)) return "media";
  const base = v.replace(/^(ctrl|shift|alt)-/, "");
  if (base.split("+").every(p => MOUSE.some(m => m[0] === p))) return "mouse";
  return "keys";
}
function parseChords(v) {
  return v.split(",").filter(Boolean).map(c => {
    const parts = c.split("-"), mods = [], key = [];
    for (const p of parts) (MODS.some(m => m[0] === p) || ["win","opt"].includes(p) ? mods : key).push(p === "win" ? "cmd" : p === "opt" ? "alt" : p);
    return {mods, key: key.join("-")};
  });
}
const joinChords = cs => cs.map(c => [...c.mods, c.key].filter(Boolean).join("-")).filter(Boolean).join(",");

function renderPad() {
  const t = id => actionLabel(id) || label(getVal(id));
  const cls = id => sel === id ? "sel" : "";
  $("#pad").innerHTML = `
    <div class="caps">${[0,1,2].map(i => `
      <button class="cap ${cls("b" + i)}" data-s="b${i}">
        <span class="num">TOUCHE ${i+1}</span><span class="txt">${t("b" + i)}</span>
        <span class="led" style="--c:${ledPreview(state.leds[i].repos)}"></span>
      </button>`).join("")}</div>
    <div class="knobwrap">
      <button class="arrow ${cls("ccw")}" data-s="ccw" title="Molette vers la gauche">◀</button>
      <button class="knob ${cls("press")}" data-s="press" title="Appui sur la molette"></button>
      <button class="arrow ${cls("cw")}" data-s="cw" title="Molette vers la droite">▶</button>
    </div>`;
  $("#pad").querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
    sel = b.dataset.s; renderPad(); renderEditor();
  });
  const knobTitle = ["◀ " + t("ccw"), "● " + t("press"), "▶ " + t("cw")].join("   ");
  $("#pad").querySelector(".knobwrap").title = knobTitle;
  paintGlow();
}

const ledPreview = st => st.effet === "eteinte" ? "#555"
  : st.effet === "arc-en-ciel" ? "linear-gradient(90deg,#f00,#0f0,#00f)" : st.couleur;

// La lueur sous le boîtier mélange les couleurs des LED allumées au repos
function paintGlow() {
  const on = state.leds.map(l => l.repos).filter(r => r.effet !== "eteinte" && r.effet !== "arc-en-ciel");
  const rgb = [0, 0, 0];
  on.forEach(r => [1, 3, 5].forEach((p, k) => rgb[k] += parseInt(r.couleur.slice(p, p + 2), 16) / on.length));
  document.documentElement.style.setProperty("--glow", rgb.map(Math.round).join(","));
}

function actionLabel(id) {
  const a = state.actions[id];
  if (!a) return "";
  return {app: "▶ " + (a.value || "?"), terminal: "⌨ " + (a.value || "?"), shell: "$ " + (a.value || "?")}[a.type];
}

function renderEditor() {
  const v = getVal(sel), kind = state.actions[sel] ? "action" : kindOf(v);
  $("#edtitle").textContent = SLOTS.find(s => s.id === sel).name;
  $("#kinds").querySelectorAll("button").forEach(b => {
    b.classList.toggle("on", b.dataset.k === kind);
    b.onclick = () => {
      if (b.dataset.k === kind) return;
      if (b.dataset.k === "action") { state.actions[sel] = {type: "app", value: ""}; renderPad(); scheduleLive(); }
      else { delete state.actions[sel]; setVal(sel, {keys:"a", media:"play"}[b.dataset.k]); }
      renderEditor();
    };
  });
  const ed = $("#editor");
  if (kind === "action") {
    const a = state.actions[sel];
    ed.innerHTML = `<select id="atype">${ACTIONS.map(x => `<option value="${x[0]}" ${x[0]===a.type?"selected":""}>${x[1]}</option>`).join("")}</select>
      ${a.type === "app" ? `<input type="text" id="aval" list="applist" value="${(a.value||"").replace(/"/g,"&quot;")}" placeholder="Nom de l'application">
        <datalist id="applist">${apps.map(n => `<option value="${n}">`).join("")}</datalist>` : ""}
      ${a.type !== "app" ? `<input type="text" id="aval" value="${(a.value||"").replace(/"/g,"&quot;")}" placeholder="${a.type === "terminal" ? "ex. top" : "ex. open ~/Downloads"}" style="width:100%;margin-top:8px">` : ""}
      <p class="hint">${{
        app: "Ouvre l'application, ou la met au premier plan si elle est déjà ouverte.",
        terminal: "Ouvre une nouvelle fenêtre Terminal et y lance la commande.",
        shell: "Commande lancée en arrière-plan, sans fenêtre."}[a.type]}</p>
      <p class="hint">Faite par l'appli Macropad, qui doit tourner en arrière-plan sur ce Mac.</p>`;
    $("#atype").onchange = e => { state.actions[sel] = {type: e.target.value, value: ""}; renderPad(); renderEditor(); scheduleLive(); };
    const av = $("#aval"); if (av) av.oninput = e => { state.actions[sel].value = e.target.value; renderPad(); };
  } else if (kind === "media") {
    ed.innerHTML = `<select id="media">${MEDIA.map(m => `<option value="${m[0]}" ${m[0]===v?"selected":""}>${m[1]}</option>`).join("")}</select>`;
    $("#media").onchange = e => setVal(sel, e.target.value);
  } else if (kind === "mouse") {
    const mod = (v.match(/^(ctrl|shift|alt)-/) || [,""])[1], act = v.replace(/^(ctrl|shift|alt)-/, "");
    ed.innerHTML = `<div class="row" style="margin-top:0">
        <select id="mact">${MOUSE.map(m => `<option value="${m[0]}" ${m[0]===act?"selected":""}>${m[1]}</option>`).join("")}</select>
        <select id="mmod"><option value="">sans modificateur</option>${["ctrl","shift","alt"].map(m => `<option ${m===mod?"selected":""}>${m}</option>`).join("")}</select></div>`;
    const upd = () => setVal(sel, ($("#mmod").value ? $("#mmod").value + "-" : "") + $("#mact").value);
    $("#mact").onchange = upd; $("#mmod").onchange = upd;
  } else {
    const chords = parseChords(v);
    if (!chords.length) chords.push({mods: [], key: "a"});
    chords.length = 1;
    ed.innerHTML = chords.map((c, i) => `<div class="chord" data-i="${i}">
        <b>${i+1}.</b>
        <span class="mods">${MODS.map(m => `<label><input type="checkbox" value="${m[0]}" ${c.mods.includes(m[0])?"checked":""}>${m[1]}</label>`).join("")}</span>
        <select class="k"><option value="">(aucune)</option>${KEYS.map(x => `<option ${x===c.key?"selected":""}>${x}</option>`).join("")}</select>
        <button class="btn capture">⌨︎ Capturer</button>
      </div>`).join("") +
      `<p class="hint">Une frappe par touche, avec ses modificateurs (ex. ⌘⇧C).</p>`;
    const read = () => [...ed.querySelectorAll(".chord")].map(r => ({
      mods: [...r.querySelectorAll("input:checked")].map(x => x.value), key: r.querySelector(".k").value }));
    const commit = cs => { setVal(sel, joinChords(cs) || "a"); renderEditor(); };
    ed.querySelectorAll("input, select").forEach(x => x.onchange = () => commit(read()));
    ed.querySelectorAll(".capture").forEach(b => b.onclick = () => {
      b.classList.add("on"); b.textContent = "Appuie sur une touche…";
      const onKey = e => {
        if (["Meta","Control","Shift","Alt"].includes(e.key)) return;
        e.preventDefault(); window.removeEventListener("keydown", onKey, true);
        let key = CODEMAP[e.code];
        if (!key && /^Key[A-Z]$/.test(e.code)) key = e.code.slice(3).toLowerCase();
        if (!key && /^Digit\d$/.test(e.code)) key = e.code.slice(5);
        if (!key && /^F\d+$/.test(e.code)) key = e.code.toLowerCase();
        if (!key && /^Numpad\d$/.test(e.code)) key = "numpad" + e.code.slice(6);
        const cs = read(), i = +b.closest(".chord").dataset.i;
        cs[i] = {mods: MODS.map(m => m[0]).filter(m => ({ctrl:e.ctrlKey, shift:e.shiftKey, alt:e.altKey, cmd:e.metaKey})[m]), key: key || ""};
        commit(cs);
      };
      window.addEventListener("keydown", onKey, true);
    });
  }
}

function renderLeds() {
  const row = (i, key, label, list) => {
    const st = state.leds[i][key];
    const noColor = ["eteinte", "arc-en-ciel", "comme_repos"].includes(st.effet);
    return `<div class="ledrow" data-i="${i}" data-k="${key}"><span>${label}</span>
      <select>${list.map(m => `<option value="${m[0]}" ${m[0]===st.effet?"selected":""}>${m[1]}</option>`).join("")}</select>
      <input type="color" value="${st.couleur}" ${noColor ? "hidden" : ""}></div>`;
  };
  $("#leds").innerHTML = state.leds.map((l, i) => `<div class="ledblock"><b>Touche ${i+1}
      <button class="btn preview ${previewMask >> i & 1 ? "on" : ""}" data-i="${i}" title="Montre l'état « appui » sur le clavier">👁 Aperçu de l'appui</button></b>
      ${row(i, "repos", "Au repos", EFFECTS)}${row(i, "appui", "Pendant l'appui", EFFECTS_PRESS)}</div>`).join("");
  $("#leds").querySelectorAll(".ledrow").forEach(r => {
    const st = state.leds[+r.dataset.i][r.dataset.k];
    r.querySelector("select").onchange = e => { st.effet = e.target.value; renderLeds(); renderPad(); scheduleLive(); };
    r.querySelector("input").oninput = e => { st.couleur = e.target.value; renderPad(); scheduleLive(); };
  });
  $("#leds").querySelectorAll(".preview").forEach(b => b.onclick = () => {
    previewMask ^= 1 << +b.dataset.i; renderLeds(); scheduleLive();
  });
  $("#bright").value = state.luminosite;
  $("#bright").oninput = e => { state.luminosite = +e.target.value; scheduleLive(); };
  $("#speed").value = state.vitesse;
  $("#speed").oninput = e => { state.vitesse = +e.target.value; scheduleLive(); };
}

function say(text, ok) { const m = $("#msg"); m.textContent = text; m.className = ok ? "ok" : "err"; }
async function post(url, body) {
  try {
    const r = await (await fetch(url, {method: "POST", body: JSON.stringify(body)})).json();
    say(r.msg, r.ok); return r;
  } catch (e) { say("Serveur injoignable : relance l'appli.", false); return {ok: false}; }
}

$("#save").onclick = async () => {
  const b = $("#save"); b.disabled = true; b.textContent = "Enregistrement…";
  previewMask = 0; renderLeds();
  await post("/api/save", state);
  b.disabled = false; b.textContent = "Enregistrer sur le clavier";
};

$("#upload").onclick = async () => {
  const b = $("#upload"); b.disabled = true; b.textContent = "Mise à jour…";
  const r = await post("/api/upload", state);
  pendingSend = !!r.waiting;
  b.disabled = false; b.textContent = pendingSend ? "En attente du clavier…" : "Mettre à jour le firmware";
};

async function pollDevice() {
  try {
    const {state: dev} = await (await fetch("/api/device")).json();
    const wasDirect = devState === "direct";
    devState = dev;
    $("#dot").classList.toggle("on", dev !== "absent");
    $("#devtxt").textContent = {direct: "branché · réglage en direct", ancien: "branché · firmware à mettre à jour",
      bootloader: "mode flash", absent: "non détecté"}[dev];
    $("#save").disabled = dev !== "direct";
    if (dev === "direct" && !wasDirect) scheduleLive();
    if (dev === "bootloader" && pendingSend) { pendingSend = false; $("#upload").click(); }
    $("#flashhint").textContent = {
      direct: "Les changements s'appliquent tout de suite au clavier. « Enregistrer » les garde après débranchement.",
      ancien: "Ce firmware ne sait pas encore régler en direct : clique « Mettre à jour le firmware » (une dernière fois par débranchement).",
      bootloader: "Le clavier est en mode flash : clique « Mettre à jour le firmware ».",
      absent: "Branche le clavier."}[dev];
  } catch { $("#devtxt").textContent = "serveur arrêté"; $("#dot").classList.remove("on"); }
}

(async () => {
  state = await (await fetch("/api/state")).json();
  state.actions = state.actions || {};
  if (!state.leds || !state.leds[0].repos) state.leds = DEFAULT_LEDS;
  state.luminosite = state.luminosite || 90;
  state.vitesse = state.vitesse || 5;
  fetch("/api/apps").then(r => r.json()).then(a => { apps = a; });
  renderPad(); renderEditor(); renderLeds(); pollDevice(); setInterval(pollDevice, 1000);
})();
</script>
</body>
</html>
